<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOSS LoRA 학습</title>
<style>
:root {
  color-scheme: dark;
  --bg: #121211;
  --surface-1: #1a1a19;
  --surface-2: #222220;
  --surface-3: #2c2c29;
  --line: #34342f;
  --text-primary: #f0efec;
  --text-secondary: #c3c2b7;
  --text-muted: #8d8c83;
  --accent: #3987e5;
  --accent-ink: #ffffff;
  --series-1: #3987e5;
  --series-2: #d95926;
  --good: #3fae6a;
  --warn: #d9a21b;
  --bad: #e66767;
  --info: #7fa7d9;
  --mono: "Cascadia Mono", Consolas, "D2Coding", monospace;
  --sans: "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text-primary); font: 13px/1.5 var(--sans); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

/* 상단 */
header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--surface-1); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 700; letter-spacing: .2px; white-space: nowrap; }
header .spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--surface-3); color: var(--text-secondary); font-size: 12px; white-space: nowrap; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
.pill.run .dot { background: var(--good); box-shadow: 0 0 0 3px #3fae6a33; animation: pulse 1.6s infinite; }
.pill.fail .dot { background: var(--bad); }
.pill.done .dot { background: var(--info); }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px #3fae6a11; } }
.btn { border: 1px solid var(--line); background: var(--surface-2); padding: 6px 12px; border-radius: 6px; white-space: nowrap; }
.btn:hover { background: var(--surface-3); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { border-color: #e6676766; color: #ffb3b3; }
.btn.small { padding: 2px 8px; font-size: 12px; }
.dirty-mark { color: var(--warn); font-size: 12px; display: none; }
.dirty .dirty-mark { display: inline; }
select.cfg-select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; max-width: 260px; }
.cfg-label { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
.saveas { display: inline-flex; gap: 6px; align-items: center; }
.saveas[hidden] { display: none; }
.saveas input { width: 190px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }

/* 레이아웃: 헤더 → 진행 막대(학습 중) → 가로 탭 → 탭 내용(이 부분만 스크롤) */
body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
#topbar { height: 5px; background: var(--surface-3); flex: none; display: none; }
#topbar.on { display: block; }
#topbar > div { height: 100%; width: 0; background: var(--good); transition: width .4s; }
.maintabs { flex: none; padding: 0 12px; }
.maintabs .tab { padding: 10px 14px; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; }
.maintabs .tab .key { font-size: 10.5px; color: var(--text-muted); opacity: .7; }
.tb { font-size: 11px; border-radius: 8px; padding: 0 6px; line-height: 16px; display: none; }
.tb.err { display: inline-block; background: #e6676733; color: #ffb3b3; }
.tb.warn { display: inline-block; background: #d9a21b33; color: #f1d58a; }
.tb.n { display: inline-block; background: var(--surface-3); color: var(--text-secondary); }
.tdirty { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); display: none; }
.tab.dirty .tdirty { display: inline-block; }
main { flex: 1; overflow: auto; min-height: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 12px; align-items: start; }
.grid .card { margin: 0; }
.grid-stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.ds-layout { display: grid; grid-template-columns: minmax(420px, 5fr) minmax(440px, 6fr); gap: 12px; align-items: start; }
.ds-layout > #picker { position: sticky; top: 0; }
.tab-issues .issues { margin-bottom: 12px; }
@media (max-width: 1000px) {
  .grid, .ds-layout, .pv-layout { grid-template-columns: 1fr; }
  .ds-layout > #picker, .pv-left { position: static; }
}

/* 설정 카드 */
.card { background: var(--surface-1); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; }
.card > summary { list-style: none; padding: 9px 12px; font-weight: 700; display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.card > summary::-webkit-details-marker { display: none; }
.card > summary::before { content: "▸"; color: var(--text-muted); transition: transform .15s; display: inline-block; }
.card[open] > summary::before { transform: rotate(90deg); }
.card > summary .sub { font-weight: 400; color: var(--text-muted); font-size: 12px; margin-left: auto; }
.card > .ch { padding: 9px 12px; font-weight: 700; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--surface-3); margin-bottom: 4px; }
.card > .ch .sub { font-weight: 400; color: var(--text-muted); font-size: 12px; margin-left: auto; }
.card .body { padding: 2px 12px 12px; }
.row { display: grid; grid-template-columns: 148px 1fr; gap: 8px; align-items: center; margin: 6px 0; }
.row > label { color: var(--text-secondary); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
.row > label code { color: var(--text-muted); font-size: 11px; display: block; font-family: var(--mono); }
.row.changed > label { color: var(--warn); }
.row.off, .row.off + .help { opacity: .5; }
.ctl { display: flex; gap: 6px; align-items: center; min-width: 0; }
.ctl input[type=text], .ctl select, .ctl textarea { flex: 1; min-width: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 5px 7px; }
.ctl textarea { font-family: var(--mono); font-size: 12px; resize: vertical; min-height: 54px; }
.ctl input:focus, .ctl select:focus, .ctl textarea:focus { outline: 2px solid #3987e566; border-color: var(--accent); }
.ctl input.num { max-width: 140px; font-family: var(--mono); }
.estimate { margin: 2px 0 8px 156px; padding: 6px 8px; border-left: 3px solid var(--accent); border-radius: 4px; background: var(--surface-2); font-size: 12px; color: var(--text-secondary); }
.estimate b { color: var(--text-primary); }
.memtable { width: 100%; border-collapse: collapse; }
.memtable th, .memtable td { padding: 4px 6px; border-bottom: 1px solid var(--surface-3); text-align: right; font-variant-numeric: tabular-nums; }
.memtable th { font-weight: 400; color: var(--text-muted); font-size: 11.5px; }
.memtable th:first-child, .memtable td:first-child { text-align: left; }
.hint { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; margin-left: 5px; border: 1px solid var(--line); border-radius: 50%; font-size: 10px; font-weight: 400; color: var(--text-muted); cursor: help; }
#pane-output.on { display: flex; flex-direction: column; height: 100%; min-height: 560px; padding-bottom: 12px; }
#grid-output { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: stretch; gap: 12px; }
.outstrip { flex: none; padding: 10px 14px; }
.out-fields { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 16px; }
.ofld { display: flex; flex-direction: column; gap: 2px; }
.ofld > label { display: flex; align-items: center; font-size: 11px; color: var(--text-muted); white-space: nowrap; }
.ofld.changed > label { color: var(--warn); }
.ofld .ctl input { width: 110px; }
.ofld.name .ctl input { width: 200px; }
.ofld.format select { width: 130px; }
.ofld.sw { flex-direction: row; align-items: center; gap: 6px; padding-bottom: 5px; }
.ofld.sw > label { font-size: 12px; color: var(--text-secondary); }
.osep { width: 1px; height: 36px; background: var(--line); }
.out-fields .spacer { flex: 1; }
.out-summary { margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--surface-3); font: 11.5px var(--mono); color: var(--text-muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.out-summary .bad { color: var(--bad); }
.out-paths { margin-top: 6px; }
.prompt-section { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.prompt-section > .ch .sub { margin-left: 0; }
.prompt-section > .ch .spacer { flex: 1; }
.prompt-layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); grid-template-rows: minmax(0, 1fr); gap: 16px; }
#promptList { height: 100%; overflow: auto; }
.pcard { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; background: var(--surface-2); }
.pcard.active { border-color: var(--accent); }
.pcard-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.pcard.active .pcard-head { margin-bottom: 6px; }
.pcard-head .spacer { flex: 1; }
.pcard-head b { flex: none; }
.pcard-head .target { display: none; font-size: 11px; color: #cfe2fb; background: #3987e522; border-radius: 4px; padding: 1px 6px; }
.pcard.active .target { display: inline; }
.pcard:not(.active) { cursor: pointer; }
.pmini { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; color: var(--text-secondary); }
.pmeta { flex: none; font-size: 11px; color: var(--text-muted); }
.pcard.active .pmini, .pcard.active .pmeta, .pcard:not(.active) .pbody, .pcard:not(.active) .pcard-btns, .pcard:not(.active) .spacer { display: none; }
.pcard-btns { display: flex; gap: 6px; }
#gallery { display: flex; flex-direction: column; min-height: 0; }
#gallery .ggrid { max-height: none; overflow: visible; }
.gscroll { flex: 1; min-height: 0; overflow: auto; }  /* 높이가 정해진 격자는 행이 눌려 겹치므로 스크롤은 바깥에서 한다 */
#gallery .gsel { flex: none; }
.pf { margin-bottom: 6px; min-width: 0; }
.pf .lbl, .psizes .lbl { display: block; font-size: 11.5px; color: var(--text-secondary); margin-bottom: 2px; }
.pf .ctl textarea { min-height: 0; font-family: var(--sans); font-size: 12.5px; background: var(--surface-1); }
.pf .ctl input[type=text] { background: var(--surface-1); }
.pf .spin { flex: 1 1 auto; }
.psizes { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; flex-wrap: wrap; }
.psizes .lbl { margin: 0 6px 0 0; }
.psizes .btn.on { border-color: var(--accent); color: #cfe2fb; background: #3987e522; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 0 10px; }
.ghead { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.ghead .sub { font-size: 11.5px; color: var(--text-muted); }
.gtools { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
.gtools input, .gtools select { flex: 1; min-width: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 4px 7px; font-size: 12px; }
.gtools .gname { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.ggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; max-height: 520px; overflow: auto; padding: 2px; }
.gtile { padding: 0; aspect-ratio: 1; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; background: var(--surface-2); }
.gtile:hover { border-color: var(--text-muted); }
.gtile.on { outline: 2px solid var(--accent); }
.gtile.nocap { opacity: .4; }
.gtile img { width: 100%; height: 100%; object-fit: contain; display: block; }
.resume { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.resume label { flex: none; font-size: 12px; color: var(--text-secondary); }
.resume select { flex: 1; min-width: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 6px 7px; }
.resume-warn { margin-bottom: 6px; font-size: 12px; color: #f0cc75; }
.pv-layout { display: grid; grid-template-columns: minmax(300px, 4fr) minmax(460px, 7fr); gap: 12px; align-items: start; }
.pv-left { position: sticky; top: 0; display: flex; flex-direction: column; height: calc(100vh - 150px); min-height: 460px; padding: 10px; background: var(--surface-1); border: 1px solid var(--line); border-radius: 8px; }
.pv-scroll { flex: 1; min-height: 0; overflow: auto; }  /* 높이가 정해진 격자는 행이 눌려 겹치므로 스크롤은 바깥에서 한다 */
.pv-left .ggrid { max-height: none; overflow: visible; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
.pv-info { padding: 10px 12px; margin-bottom: 10px; background: var(--surface-1); border: 1px solid var(--line); border-radius: 8px; }
.pv-name { font-weight: 600; overflow-wrap: anywhere; }
.pv-flow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 4px; font-size: 12.5px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.pv-flow b { color: var(--text-primary); }
.pv-flow .arrow { color: var(--text-muted); }
.pv-set { margin-top: 3px; font-size: 11.5px; color: var(--text-muted); }
.pv-card { display: block; width: 100%; padding: 0; margin-bottom: 10px; text-align: left; background: var(--surface-1); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: zoom-in; }
.pv-card:hover { border-color: var(--text-muted); }
.pv-card .head { display: flex; justify-content: space-between; gap: 8px; padding: 7px 12px; font-size: 12.5px; color: var(--text-primary); border-bottom: 1px solid var(--line); }
.pv-card .head span { color: var(--text-muted); font-size: 11.5px; }
.pv-one { display: flex; justify-content: center; padding: 8px; background: #0b0b0a; }
.pv-one img { display: block; max-width: 100%; height: 46vh; min-height: 240px; object-fit: contain; }
.pv-three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: #0b0b0a; }
.pv-three figure { margin: 0; padding: 6px; min-width: 0; }
.pv-three figcaption { margin-bottom: 4px; font-size: 11.5px; color: var(--text-secondary); }
.pv-three img, .pv-three .pv-wait { display: block; width: 100%; height: 24vh; min-height: 130px; object-fit: contain; }
.pv-three .pv-wait { display: flex; align-items: center; justify-content: center; text-align: center; font-size: 12px; color: var(--text-muted); border: 1px dashed var(--line); border-radius: 5px; }
#viewer { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: #0b0b0a; color: #eee; user-select: none; }
#viewer[hidden] { display: none; }
.vw-panes { flex: 1; display: flex; gap: 2px; min-height: 0; cursor: grab; }
#viewer.drag .vw-panes { cursor: grabbing; }
.vw-pane { position: relative; flex: 1; min-width: 0; background: #0b0b0a; }
.vw-pane canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.vw-label { position: absolute; top: 8px; left: 8px; padding: 3px 8px; font-size: 13px; background: #000a; border-radius: 4px; pointer-events: none; }
.vw-label span { color: #bbb; font-size: 12px; margin-left: 6px; }
.vw-msg { position: absolute; left: 12px; right: 12px; top: 50%; text-align: center; font-size: 14px; color: #ddd; pointer-events: none; overflow-wrap: anywhere; }
.vw-hud { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); padding: 4px 12px; font-size: 12.5px; white-space: nowrap; background: #000a; border-radius: 6px; pointer-events: none; }
.vw-hud b { margin-right: 10px; font-variant-numeric: tabular-nums; }
.gmore { grid-column: 1 / -1; }
.gsel { margin-top: 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); font-size: 12px; }
.gsel-head { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
.gsel-head b { font-weight: 400; font-family: var(--mono); color: var(--text-secondary); margin-right: 6px; word-break: break-all; }
.gsel-head .btn.on { border-color: var(--accent); color: #cfe2fb; }
.gcap { max-height: 90px; overflow: auto; white-space: pre-wrap; color: var(--text-secondary); }
@media (max-width: 1000px) {
  .prompt-layout { grid-template-columns: 1fr; grid-template-rows: none; }
  .estimate { margin-left: 0; }
  #pane-output.on { height: auto; }
  #promptList { height: auto; }
  .gscroll { max-height: 520px; }
}
.spin { position: relative; flex: 0 0 130px; display: block; }
.ctl .spin input.num { width: 100%; max-width: none; padding-right: 26px; text-align: center; }
.spinbtns { position: absolute; top: 3px; bottom: 3px; right: 3px; width: 19px; display: flex; flex-direction: column; gap: 1px; }
.spinbtns button { flex: 1; min-height: 0; padding: 0; border: 0; border-radius: 2px; display: flex; align-items: center; justify-content: center; background: var(--surface-3); color: var(--text-secondary); }
.spinbtns button:hover { background: #45453f; color: var(--text-primary); }
.spinbtns button:active { background: var(--accent); color: var(--accent-ink); }
.lrslider { position: relative; flex: 1; min-width: 140px; max-width: 380px; padding-bottom: 16px; margin-left: 6px; }
.lrslider input[type=range] { display: block; width: 100%; margin: 0; accent-color: var(--accent); }
.lrslider .ticks button { position: absolute; bottom: 0; transform: translateX(-50%); background: none; border: 0; padding: 0; color: var(--text-muted); font: 11px var(--mono); }
.lrslider .ticks button::before { content: ""; position: absolute; left: 50%; top: -5px; width: 1px; height: 4px; background: var(--text-muted); }
.lrslider .ticks button:hover { color: var(--text-primary); }
.badge { font-size: 11px; padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
.badge.ok { background: #3fae6a22; color: #8fd8a8; }
.badge.bad { background: #e6676722; color: #ffb3b3; }
.badge.note { background: #7fa7d922; color: #b8d0ee; }
.badge.warn { background: #d9a21b22; color: #f0cc75; }
.help { color: var(--text-muted); font-size: 11.5px; margin: -2px 0 6px 156px; }
.switch { position: relative; width: 34px; height: 18px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span { position: absolute; inset: 0; background: var(--surface-3); border-radius: 9px; border: 1px solid var(--line); transition: .15s; }
.switch span::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--text-muted); transition: .15s; }
.switch input:checked + span { background: var(--accent); border-color: var(--accent); }
.switch input:checked + span::after { left: 18px; background: #fff; }
.switch input:focus-visible + span { outline: 2px solid #3987e599; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
.presets .btn { font-size: 12px; padding: 3px 9px; }
.presets .btn.on { border-color: var(--accent); color: #cfe2fb; background: #3987e522; }
.presets .plabel { align-self: center; margin-right: 4px; font-size: 12px; color: var(--text-secondary); }

/* 오른쪽 */
.progress-strip { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface-1); }
.prog-top { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; }
.stat .k { font-size: 11px; color: var(--text-muted); }
.stat .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 12px; color: var(--text-muted); font-weight: 400; }
.remain { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; padding: 6px 14px; border: 1px solid var(--accent); border-radius: 8px; background: #3987e51f; }
.remain .k { font-size: 12px; color: var(--text-secondary); }
.remain .v { font-size: 30px; line-height: 1.15; font-weight: 700; font-variant-numeric: tabular-nums; }
.remain .finish { font-size: 12px; color: var(--text-secondary); }
.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 18px; margin-top: 12px; }
.meter .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12px; color: var(--text-secondary); }
.meter .top b { font-size: 14px; color: var(--level, var(--text-primary)); font-variant-numeric: tabular-nums; }
.meter .sub { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; min-height: 16px; }
.meter .sub.warn { color: #f0cc75; }
.meter .track { height: 6px; background: var(--surface-3); border-radius: 3px; margin-top: 4px; overflow: hidden; }
.meter .fill { height: 100%; background: var(--level, var(--accent)); border-radius: 3px; transition: width .4s; }
.bar { position: relative; height: 16px; background: var(--surface-3); border-radius: 4px; margin-top: 10px; overflow: hidden; }
#pBar { height: 100%; background: var(--good); width: 0; transition: width .4s; }
#pTicks span { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--surface-1); }
.bar-epochs { display: flex; min-height: 16px; margin-top: 2px; font-size: 11px; line-height: 16px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.bar-epochs span { flex: 1 1 0; min-width: 0; text-align: center; }
.bar-epochs .done { color: var(--text-secondary); }
.bar-epochs .now { color: var(--good); font-weight: 700; }
.tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--surface-1); overflow-x: auto; }
.tab { border: 0; background: none; padding: 9px 12px; color: var(--text-muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab.on { color: var(--text-primary); border-bottom-color: var(--accent); }
.tab .count { font-size: 11px; background: var(--surface-3); border-radius: 8px; padding: 0 6px; margin-left: 4px; }
.tab .count.err { background: #e6676733; color: #ffb3b3; }
.pane { display: none; padding: 14px 16px 40px; }
.pane.on { display: block; }
.pane.monitor.on { display: flex; flex-direction: column; height: 100%; min-height: 560px; padding-bottom: 12px; }
.monitor .progress-strip { flex: none; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; }
.logbox { flex: 0 0 clamp(110px, 18vh, 190px); display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-top: 8px; }

.issues { list-style: none; padding: 0; margin: 0 0 14px; }
.issues li { display: flex; gap: 8px; padding: 7px 10px; border-radius: 6px; margin-bottom: 4px; background: var(--surface-1); border-left: 3px solid var(--line); }
.issues li .ic { flex: none; font-weight: 700; width: 38px; font-size: 11px; padding-top: 1px; }
.issues li.error { border-left-color: var(--bad); } .issues li.error .ic { color: var(--bad); }
.issues li.warn { border-left-color: var(--warn); } .issues li.warn .ic { color: var(--warn); }
.issues li.info { border-left-color: var(--info); } .issues li.info .ic { color: var(--info); }
.issues li.okmsg { border-left-color: var(--good); } .issues li.okmsg .ic { color: var(--good); }
h3 { font-size: 13px; margin: 18px 0 8px; color: var(--text-secondary); }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.kpi { background: var(--surface-1); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.kpi .k { font-size: 11px; color: var(--text-muted); }
.kpi .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: 11px; font-weight: 400; color: var(--text-muted); }
.subcard { background: var(--surface-1); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 8px; }
.subcard-head { display: flex; align-items: center; gap: 6px; }
.subcard .path { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12px; color: var(--text-secondary); word-break: break-all; }
.subcard table { border-collapse: collapse; margin-top: 6px; font-size: 12px; }
.subcard td { padding: 2px 14px 2px 0; }
.subcard td:first-child { color: var(--text-muted); }
.subcard details { margin-top: 6px; font-size: 12px; }
.subcard details ul { margin: 4px 0; padding-left: 18px; max-height: 160px; overflow: auto; font-family: var(--mono); color: var(--text-secondary); }
.thumbs { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; }
.thumbs img { height: 72px; border-radius: 4px; border: 1px solid var(--line); cursor: zoom-in; background: var(--surface-2); }

.chart-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-secondary); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.legend i.dot { width: 8px; height: 8px; border-radius: 50%; }
.chart-wrap { flex: 1 1 0; min-height: 150px; position: relative; background: var(--surface-1); border: 1px solid var(--line); border-radius: 8px; }
.chart-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.tooltip { position: absolute; pointer-events: none; background: #0b0b0bee; border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font-size: 12px; display: none; white-space: nowrap; z-index: 2; }
.tooltip b { font-variant-numeric: tabular-nums; }
.empty { color: var(--text-muted); padding: 30px 0; text-align: center; }

.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.gallery figure { margin: 0; background: var(--surface-1); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: zoom-in; }
.gallery img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; background: var(--surface-2); }
.gallery figcaption { font-size: 11px; color: var(--text-muted); padding: 4px 8px; font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.models { width: 100%; border-collapse: collapse; font-size: 12px; }
.models th { text-align: left; color: var(--text-muted); font-weight: 400; border-bottom: 1px solid var(--line); padding: 4px 6px; }
.models td { padding: 5px 6px; border-bottom: 1px solid var(--surface-3); font-variant-numeric: tabular-nums; }
.models td:first-child { font-family: var(--mono); }
.hist { margin-top: 18px; }
.hist-body { padding: 0 12px 12px; }
.hist-body > .card:last-child { margin-bottom: 0; }

.log-tools { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--text-muted); }
.log-tools input[type=text] { background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 3px 7px; width: 200px; }
#log { flex: 1; overflow: auto; margin: 0; padding: 10px 12px; font: 12px/1.45 var(--mono); white-space: pre-wrap; word-break: break-all; background: #0e0e0d; color: #d6d5cf; }
#log .e { color: #ff9b9b; } #log .w { color: #e9c46a; } #log .u { color: #8fbff3; }
#log-partial { padding: 6px 12px; font: 12px var(--mono); background: #171716; border-top: 1px solid var(--line); color: #a9d6b3; white-space: pre; overflow: hidden; text-overflow: ellipsis; min-height: 28px; }
pre.cmd { background: #0e0e0d; border: 1px solid var(--line); padding: 10px; border-radius: 6px; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-all; }

#lightbox { position: fixed; inset: 0; background: #000d; display: none; align-items: center; justify-content: center; z-index: 20; flex-direction: column; gap: 8px; cursor: zoom-out; }
#lightbox img { max-width: 94vw; max-height: 88vh; }
#lightbox div { color: var(--text-secondary); font: 12px var(--mono); }
/* 학습 폴더 선택 */
.pk { background: var(--surface-1); border: 1px solid var(--line); border-radius: 8px; height: calc(100vh - 150px); min-height: 460px; display: flex; flex-direction: column; overflow: hidden; }
.pk-head { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.pk-head b { margin-right: 6px; }
.pk-head input { background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; font-family: var(--mono); font-size: 12px; }
.pk-tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); }
.pk-body { flex: 1; overflow: auto; padding: 8px 12px; min-height: 0; }
.pk-group { margin-bottom: 10px; }
.pk-ghead { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); padding: 4px 0; font-family: var(--mono); }
.pk-ghead .topic { color: var(--text-primary); font-family: var(--sans); font-weight: 700; font-size: 13px; }
.pk-row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 5px; cursor: pointer; font-size: 12.5px; }
.pk-row:hover { background: var(--surface-2); }
.pk-row.sel { background: #3987e526; outline: 1px solid #3987e599; }
.pk-row.dim { opacity: .55; }
.pk-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pk-row .nm.dir::before { content: "▸ "; color: var(--text-muted); }
.pk-crumbs { display: flex; flex-wrap: wrap; gap: 2px; font-family: var(--mono); font-size: 12px; margin-bottom: 8px; }
.pk-crumbs button { background: none; border: 0; color: var(--info); padding: 1px 3px; }
.pk-detail { border-top: 1px solid var(--line); padding: 10px 12px; background: var(--surface-2); min-height: 120px; }
.pk-detail .path { font-family: var(--mono); font-size: 12px; word-break: break-all; color: var(--text-secondary); }
.pk-detail .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.pk-detail .thumbs img { height: 64px; }
.verdict { margin-top: 6px; padding: 5px 8px; border-left: 3px solid var(--line); border-radius: 4px; background: var(--surface-1); font-size: 12px; color: var(--text-secondary); }
.verdict b { display: block; color: var(--text-primary); }
.verdict.ok { border-left-color: var(--good); }
.verdict.ok b { color: #8fd8a8; }
.verdict.warn { border-left-color: var(--warn); }
.verdict.warn b { color: #f0cc75; }
.verdict.bad { border-left-color: var(--bad); }
.verdict.bad b { color: #ffb3b3; }
.pk-subs { margin-top: 8px; }
.pk-subs .sum { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.pk-subs .list { max-height: 150px; overflow: auto; border: 1px solid var(--line); border-radius: 5px; padding: 2px; }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--surface-3); border: 1px solid var(--line); padding: 8px 14px; border-radius: 8px; display: none; z-index: 30; max-width: 80vw; }
#toast.err { border-color: var(--bad); color: #ffc9c9; }
</style>
</head>
<body>
<header id="hdr">
  <h1>MOSS-Image LoRA 학습</h1>
  <label class="cfg-label" for="cfgSelect">설정 불러오기</label>
  <select class="cfg-select" id="cfgSelect" title="고르면 그 설정을 불러옵니다 (학습 설정·데이터셋·샘플 프롬프트)"></select>
  <button class="btn" id="btnSaveAs" title="현재 설정을 새 이름으로 저장합니다. 지금 파일은 바뀌지 않습니다">다른 이름으로 저장</button>
  <span class="saveas" id="saveAsBox" hidden>
    <input type="text" id="saveAsName" placeholder="LoRA 이름" spellcheck="false" maxlength="80">
    <button class="btn primary" id="saveAsOk">저장</button>
    <button class="btn" id="saveAsCancel">취소</button>
  </span>
  <span class="dirty-mark">● 저장 안 됨</span>
  <span class="spacer"></span>
  <span class="pill" id="statusPill"><span class="dot"></span><span id="statusText">대기</span></span>
  <button class="btn" id="btnReload" title="파일에서 다시 읽기">다시 읽기</button>
  <button class="btn" id="btnSave" title="Ctrl+S">저장</button>
  <button class="btn primary" id="btnStart">학습 시작</button>
  <button class="btn danger" id="btnStop" disabled>중지</button>
</header>
<div id="topbar"><div id="topbarFill"></div></div>
<nav class="tabs maintabs" id="tabs">
  <button class="tab on" data-pane="dataset">데이터셋<span class="tb" data-tb="dataset"></span><span class="tdirty"></span><span class="key">1</span></button>
  <button class="tab" data-pane="preview">자료 미리보기<span class="key">2</span></button>
  <button class="tab" data-pane="train">학습 설정<span class="tb" data-tb="train"></span><span class="tdirty"></span><span class="key">3</span></button>
  <button class="tab" data-pane="memory">메모리·속도<span class="tb" data-tb="memory"></span><span class="tdirty"></span><span class="key">4</span></button>
  <button class="tab" data-pane="output">출력·샘플<span class="tb" data-tb="output"></span><span class="tdirty"></span><span class="key">5</span></button>
  <button class="tab" data-pane="run">실행<span class="tb" data-tb="run"></span><span class="key">6</span></button>
  <button class="tab" data-pane="monitor">모니터<span class="key">7</span></button>
  <button class="tab" data-pane="results">결과<span class="tb n" id="sampleCount">0</span><span class="key">8</span></button>
</nav>
<main id="main">
  <div class="pane on" id="pane-dataset">
    <div class="tab-issues" data-issues="dataset"></div>
    <div class="ds-layout">
      <div id="picker">
        <div class="pk">
          <div class="pk-head">
            <b>학습 폴더 선택</b>
            <input type="text" id="pkRoot" spellcheck="false" style="flex:1;min-width:200px" title="기준 폴더">
            <button class="btn small" id="pkRootApply">이동</button>
            <button class="btn small" id="pkRefresh" title="폴더 다시 찾기">새로고침</button>
            <input type="text" id="pkFilter" placeholder="검색 (폴더 이름)" style="width:100%">
          </div>
          <nav class="pk-tabs">
            <button class="tab on" data-pktab="found">찾은 학습 폴더</button>
            <button class="tab" data-pktab="browse">폴더 탐색</button>
          </nav>
          <div class="pk-body" id="pkBody"></div>
          <div class="pk-detail" id="pkDetail"></div>
        </div>
      </div>
      <div id="dsRight"></div>
    </div>
  </div>
  <div class="pane" id="pane-preview"><div class="pv-layout"><div class="pv-left" id="pvLeft"></div><div id="pvRight"></div></div></div>
  <div class="pane" id="pane-train"><div class="tab-issues" data-issues="train"></div><div class="grid" id="grid-train"></div></div>
  <div class="pane" id="pane-memory"><div class="tab-issues" data-issues="memory"></div><div class="grid" id="grid-memory"></div></div>
  <div class="pane" id="pane-output"><div class="tab-issues" data-issues="output"></div><div class="grid" id="grid-output"></div></div>
  <div class="pane" id="pane-run">
    <div class="grid">
      <section class="card"><div class="ch">설정 점검<span class="sub">저장된 파일 기준</span><button class="btn small" id="btnCheck">다시 점검</button></div><div class="body" id="runIssues"></div></section>
      <div>
        <section class="card"><div class="ch">학습 시작</div><div class="body" id="runStart"></div></section>
        <section class="card" style="margin-top:12px"><div class="ch">추가 인자<span class="sub">명령줄 덧붙임 · 설정 파일보다 우선</span></div><div class="body">
          <div class="ctl"><textarea id="extraArgs" rows="2" placeholder="--max_train_steps 500 --save_every_n_steps 100"></textarea></div>
          <div class="help" style="margin:4px 0 0">이 값은 브라우저에만 기억됩니다.</div></div></section>
        <section class="card" style="margin-top:12px"><div class="ch">실행 명령</div><div class="body" id="pane-cmd"></div></section>
      </div>
    </div>
  </div>
  <div class="pane monitor" id="pane-monitor">
    <div class="progress-strip">
      <div class="prog-top">
        <div class="stat"><span class="k">스텝</span><span class="v" id="pStep">–</span></div>
        <div class="stat"><span class="k">에포크</span><span class="v" id="pEpoch">–</span></div>
        <div class="stat"><span class="k">평균 loss</span><span class="v" id="pLoss">–</span></div>
        <div class="stat"><span class="k">속도</span><span class="v" id="pRate">–</span></div>
        <div class="stat" title="최근 30스텝 평균. 샘플 생성·저장처럼 한 번 크게 튄 구간은 뺍니다"><span class="k">스텝당 시간</span><span class="v" id="pStepTime">–</span></div>
        <div class="stat"><span class="k">경과</span><span class="v" id="pElapsed">–</span></div>
        <div class="remain" title="최근 30스텝의 스텝당 시간으로 계산합니다. 에포크마다 하는 샘플 생성·저장 시간은 포함하지 않습니다">
          <span class="k">남은 시간</span><span class="v" id="pRemain">–</span><span class="finish" id="pFinish"></span>
        </div>
      </div>
      <div class="bar"><div id="pBar"></div><div id="pTicks"></div></div>
      <div class="bar-epochs" id="pEpochs" title="에포크"></div>
      <div class="meters" id="meters"></div>
    </div>
    <div class="chart-head">
      <select class="cfg-select" id="runSelect" title="TensorBoard 로그(실행별)"></select>
      <div class="legend">
        <span><i style="background:var(--series-1);opacity:.35"></i>loss (스텝)</span>
        <span><i style="background:var(--series-1)"></i>이동 평균</span>
        <span><i class="dot" style="background:var(--series-2)"></i>에포크 평균</span>
      </div>
      <span class="spacer" style="flex:1"></span>
      <label style="font-size:12px;color:var(--text-muted)"><input type="checkbox" id="chkLogY"> 로그 눈금</label>
    </div>
    <div class="chart-wrap" id="chartWrap"><canvas id="chart"></canvas><div class="tooltip" id="tip"></div></div>
    <div id="chartInfo" style="margin-top:8px;color:var(--text-muted);font-size:12px"></div>
    <div class="logbox">
      <div class="log-tools">
        <b style="color:var(--text-secondary)">로그</b><span id="logPath"></span><span style="flex:1"></span>
        <input type="text" id="logFilter" placeholder="필터 (예: error)">
        <label><input type="checkbox" id="chkFollow" checked> 자동 스크롤</label>
      </div>
      <pre id="log"></pre>
      <div id="log-partial"></div>
    </div>
  </div>
  <div class="pane" id="pane-results"></div>
</main>
<div id="viewer" hidden tabindex="-1"><div class="vw-panes" id="vwPanes"></div><div class="vw-hud"><b id="vwZoom">100%</b>WASD·드래그 이동 · 휠 확대/축소 · 우클릭·Esc 닫기</div></div>
<div id="lightbox"><img alt=""><div></div></div>
<div id="toast"></div>

<script>
"use strict";
// ---------------------------------------------------------------- 스키마
// t: file|dir|text|int|num|bool|select|lines,  d: 비웠을 때 sd-scripts 기본값(표시용)
const CFG_GROUPS = [
  { id: "model", title: "모델", tab: "train", items: [
    { k: "pretrained_model_name_or_path", l: "DiT", t: "file", h: "공식 샤드면 00001 파일, ComfyUI 단일 파일(bf16/ConvRot INT8) 가능" },
    { k: "text_encoder", l: "텍스트 인코더", t: "file", h: "Qwen3.5-9B 첫 샤드 또는 qwen3.5_9b_int8_convrot (GPTQ 불가)" },
    { k: "vae", l: "VAE", t: "file", h: "flux2-vae.safetensors" },
    { k: "tokenizer_cache_dir", l: "토크나이저 캐시", t: "dir", h: "비우면 Hugging Face 에서 내려받음" },
  ]},
  { id: "dataset", title: "데이터 로더·설정 파일", tab: "dataset", items: [
    { k: "dataset_config", l: "dataset.toml", t: "file" },
    { k: "max_data_loader_n_workers", l: "로더 작업 수", t: "int", d: "8", h: "학습 데이터를 미리 읽어 두는 보조 프로세스 수. 권장 2 — 더 늘려도 빨라지지 않고 메모리만 더 씁니다. 0 이면 학습 프로세스가 직접 읽으며, 이때는 아래 유지를 꺼야 합니다." },
    { k: "persistent_data_loader_workers", l: "작업 프로세스 유지", t: "bool", h: "에포크가 끝나도 보조 프로세스를 닫지 않고 다시 씁니다. Windows 에서 끄면 에포크마다 새로 만들어 학습이 몇 배 느려질 수 있으니 켜 두세요(데이터셋이 작을수록 영향이 큽니다). 메모리는 조금 더 쓸 수 있습니다." },
  ]},
  { id: "schedule", title: "학습 길이", tab: "train", items: [
    { k: "max_train_epochs", l: "에포크", t: "int", spin: { min: 1 } },
  ]},

async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({ error: "응답 오류" }));
  if (!r.ok) { const e = new Error(j.error || r.statusText); e.data = j; throw e; }

}

function toEdit(f, v) {
  if (f.t === "bool" && f.on) return v === undefined || v === f.on;  // 문자열 설정을 스위치로 다룬다. 키가 없으면 켜짐
  if (f.t === "bool") return !!v;
  if (f.t === "lines") return Array.isArray(v) ? v.join("\n") : (v ?? "");
  if (f.t === "reso") return Array.isArray(v) ? v.join(",") : (v ?? "") + "";
  // 파일에는 비율(0.05)로 저장한다. 1 이상은 절대 스텝이라 % 로 옮길 수 없어 칸을 비우고 안내만 한다(ctlHtml)
  if (f.t === "pct") return typeof v === "number" && v < 1 ? String(+(v * 100).toFixed(4)) : "";
  return v === undefined || v === null ? "" : String(v);
}
function toSave(f, v) {
  if (f.t === "bool" && f.on) return v ? f.on : f.off;
  if (f.t === "bool") return !!v;
  const s = String(v).trim();
  if (f.t === "lines") { const a = s.split("\n").map(x => x.trim()).filter(Boolean); return a.length ? a : null; }
  if (s === "") return null;
  if (f.t === "int" || f.t === "num") return { raw: s };
  if (f.t === "pct") return { raw: String(+(parseFloat(s) / 100).toFixed(6)) };
  if (f.t === "reso") { const p = s.split(/[,x ]+/).filter(Boolean); return p.length > 1 ? p.map(Number) : { raw: p[0] }; }
  return s;
}
function validNum(f, s) {
  s = String(s).trim();
  if (!s) return true;
  if (f.t === "int") return /^[+-]?\d+$/.test(s);
  if (f.t === "num") return /^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(s);
  if (f.t === "reso") return /^\d+([,x ]+\d+)?$/.test(s);
  if (f.t === "pct") return /^\d+(\.\d+)?$/.test(s) && parseFloat(s) < 100;
  return true;
}

// 스텝 수는 저장 전 입력값으로 바로 계산한다. 이미지 수만 마지막 점검 결과를 쓴다
const ESTIMATE_KEYS = new Set(["max_train_epochs", "batch_size", "num_repeats", "image_dir"]);
function stepsEstimate() {
  const scans = S.check?.dataset?.subsets;
  if (!scans || !S.ds) return null;
  let images = 0, samples = 0, unknown = false, minRepeat = Infinity, maxRepeat = 0;
  for (const sub of S.ds.subsets) {
    const scan = scans.find(s => s.image_dir === sub.image_dir);
    if (!scan?.ok) { unknown = true; continue; }
    const repeat = parseInt(sub.num_repeats) || 1;
    images += scan.num_images;
    samples += scan.num_images * repeat;
    if (scan.num_images) { minRepeat = Math.min(minRepeat, repeat); maxRepeat = Math.max(maxRepeat, repeat); }
  }
  const batch = parseInt(S.ds.dataset.batch_size) || 1, epochs = parseInt(S.cfg.max_train_epochs) || 0;
  const perEpoch = Math.ceil(samples / batch);
  return { images, samples, batch, epochs, perEpoch, total: perEpoch * epochs, unknown, minRepeat, maxRepeat };
}

function fieldById(id) {

function onInput(e) {

  if (el.id === "promptsText") { S.prompts = el.value; markDirty(); return; }
  if (el.id === "gFilter") { G.filter = el.value.trim().toLowerCase(); G.shown = GALLERY_PAGE; renderGalleryGrid(); return; }
  if (el.id === "gFolder") { G.folder = +el.value; G.shown = GALLERY_PAGE; renderGalleryGrid(); return; }
  if (el.id === "resumeSelect") { S.resume = el.value; renderResume(); updateCmd(); return; }
  if (el.id === "vFilter") { V.filter = el.value.trim().toLowerCase(); V.shown = GALLERY_PAGE; renderPreviewGrid(); return; }
  if (el.id === "vFolder") { V.folder = +el.value; V.shown = GALLERY_PAGE; renderPreviewGrid(); return; }
  if (el.dataset.lrslider !== undefined) { onLrSlider(el); return; }
  const fx = el.id && fieldById(el.id);
  if (!fx || !fx.f || !fx.obj) return;  // 칸을 지운 뒤 포커스가 남은 입력칸이 다시 그려지며 change 를 보낼 수 있다

  if (isPromptId(el.id)) { S.prompts = serializePrompts(); updatePromptMarks(); updatePromptMini(+el.id.match(/^p(\d+)_/)[1]); }
  if (OUT_PATHS.some(p => p[1] === fx.key)) updateOutSummary();

// ---------------------------------------------------------------- 학습 실행·상태
async function start() {

  let r;
  const body = { config_path: S.configPath, extra_args: S.extraArgs, resume: S.resume };
  try { r = await api("/api/start", body); }
  catch (e) {
    if (e.data?.issues) {
      if (!confirmBox(`설정 오류:\n- ${e.data.issues.join("\n- ")}\n\n그래도 시작할까요?`)) { switchTab("run"); runCheck(); return; }
      try { r = await api("/api/start", { ...body, force: true }); }
      catch (e2) { toast("시작 실패: " + e2.message, true); return; }
    } else { toast("시작 실패: " + e.message, true); return; }
  }
  S.logSeq = 0; S.logLines = []; $("#log").textContent = "";
  S.resume = ""; renderResume();  // 고른 지점은 한 번만 쓴다
  toast(r.settings_dir ? `현재 설정을 저장하고 학습을 시작했습니다 — 사본: ${r.settings_dir.split(/[\\/]/).pop()}` : "현재 설정을 저장하고 학습을 시작했습니다 (설정 사본은 만들지 못했습니다)", !r.settings_dir);
  switchTab("monitor"); poll();
}
// 모달 대화상자는 자동화 도구를 막을 수 있어 window.confirm 대신 인라인 확인을 쓴다

    return;

  pendingStop = 0;
  try {
    const r = await api("/api/stop", { force });

    box.innerHTML = Array.from({ length: epochs }, (_, i) => `<span>${i && (i + 1) % every ? "" : i + 1}</span>`).join("");

  const now = total ? Math.min(epochs, Math.floor(step / total * epochs) + 1) : 0;

}
// tqdm 의 남은 시간은 전체 평균이라 초반 튜닝 구간에 끌려 길게 나온다. 최근 스텝 시간으로 계산한다

  const s = Math.round(sec), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;

}

  const days = Math.round((new Date(end.getFullYear(), end.getMonth(), end.getDate()) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
  const time = `${String(end.getHours()).padStart(2, "0")}:${String(end.getMinutes()).padStart(2, "0")}`;

const MEMORY_WARN = 0.9;  // 이 비율을 넘으면 메모리가 곧 찬다고 알린다
const METER_LEVELS = [[0.95, "--bad"], [0.85, "--series-2"], [0.6, "--warn"], [0, "--good"]];  // 사용률 구간별 색, 높은 쪽부터
function meterHtml(label, value, ratio, sub, warn) {

  return `<div class="meter" ${level}><div class="top"><span>${label}</span><b>${value}</b></div>`

}
function renderMeters(sys) {
  const gpu = sys?.gpu, ram = sys?.ram, parts = [];

    parts.push(meterHtml("GPU", gpu.util != null ? `${Math.round(gpu.util)}%` : "–", (gpu.util || 0) / 100, info, false));

    parts.push(meterHtml("VRAM", `${gpu.vram_used_gb.toFixed(1)} / ${gpu.vram_total_gb.toFixed(1)} GB`, r, warn ? "⚠ 거의 찼습니다" : `${Math.round(r * 100)}%`, warn));
  } else parts.push(meterHtml("GPU", "–", 0, "nvidia-smi 를 읽지 못했습니다", false));

const fmtStepTime = t => (t < 60 ? `${t.toFixed(2)}초` : `${Math.floor(t / 60)}분 ${Math.round(t % 60)}초`);
function logClass(t) {
  if (/^\[UI\]|^> /.test(t)) return "u";

}
function appendLog(lines) {
  const pre = $("#log"), filt = $("#logFilter").value.trim().toLowerCase();
  const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 30;
  S.logLines.push(...lines);
  if (S.logLines.length > 6000) { S.logLines = S.logLines.slice(-4000); return redrawLog(); }
  const frag = document.createDocumentFragment();
  for (const t of lines) {
    if (filt && !t.toLowerCase().includes(filt)) continue;

}
function redrawLog() { $("#log").textContent = ""; const l = S.logLines; S.logLines = []; appendLog(l); }

let polling = false, lastRunning = false, tick = 0;
async function poll() {
  if (polling) return; polling = true;
  try {
    const st = await api("/api/status?since=" + S.logSeq);
    if (st.reset) { S.logSeq = 0; S.logLines = []; $("#log").textContent = ""; polling = false; return poll(); }
    if (st.lines.length) appendLog(st.lines);
    S.logSeq = st.seq;
    $("#log-partial").textContent = st.partial || "";
    setStatus(st);
    tick++;
    if (st.running && tick % 5 === 0) { refreshScalars(); }
    if (st.running && tick % 10 === 0) { refreshOutputs(); if (!S.runs.length || tick % 30 === 0) refreshRuns(); }
    if (lastRunning && !st.running) {
      refreshRuns(); refreshOutputs(); runCheck(); refreshResume();
      if (st.exit_code === "중지됨") toast(st.saved_state ? "중단 지점을 저장했습니다 — 실행 탭의 '이어서 학습'에서 고르면 이어집니다" : "저장 없이 중지했습니다");
    }
    lastRunning = S.running = st.running;
  } catch (e) { $("#statusText").textContent = "UI 서버 연결 끊김"; }
  polling = false;
}

// ---------------------------------------------------------------- 그래프
async function refreshRuns() {

  try { S.runs = await api("/api/runs?logging_dir=" + encodeURIComponent(S.cfg.logging_dir)); } catch (e) { S.runs = []; }
  if (!S.runs.find(r => r.path === S.run) || (S.running && S.runs[0] && S.run !== S.runs[0].path && !S.runPinned)) S.run = S.runs[0]?.path || "";
  renderRunSelect(); refreshScalars();
}
function renderRunSelect() {
  $("#runSelect").innerHTML = S.runs.length ? S.runs.map(r => `<option value="${esc(r.path)}" ${r.path === S.run ? "selected" : ""}>${esc(r.name)} · ${fmtTime(r.mtime)}</option>`).join("") : `<option>로그 없음</option>`;
}
async function refreshScalars() {
  if (!S.run) { S.scalars = null; drawChart(); return; }
  try { S.scalars = await api(`/api/scalars?logging_dir=${encodeURIComponent(S.cfg.logging_dir)}&run=${encodeURIComponent(S.run)}`); }
  catch (e) { S.scalars = null; }

const chart = { pts: null, geom: null };
function drawChart() {
  const wrap = $("#chartWrap"), cv = $("#chart"), info = $("#chartInfo");
  const W = wrap.clientWidth, H = wrap.clientHeight;
  if (!W) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement), col = n => css.getPropertyValue(n).trim();
  const sc = S.scalars;
  const cur = sc?.["loss/current"] || [], avg = sc?.["loss/average"] || [], ep = sc?.["loss/epoch_average"] || [], lr = sc?.["lr/unet"] || [];
  chart.pts = null;
  if (!cur.length) {
    ctx.fillStyle = col("--text-muted"); ctx.font = `13px ${col("--sans")}`; ctx.textAlign = "center";
    ctx.fillText(S.runs.length ? "아직 기록된 loss 가 없습니다" : "TensorBoard 로그가 없습니다 (logging_dir)", W / 2, H / 2);
    info.textContent = ""; return;
  }
  const logY = $("#chkLogY").checked;
  // 에포크 평균은 x 가 에포크 번호로 기록되므로, 기록 시각 직전의 스텝 위치로 옮긴다
  const stepAt = wt => { let s = cur[0][0]; for (const p of cur) { if (p[2] <= wt + 1e-3) s = p[0]; else break; } return s; };
  const epPts = ep.map(([e, v, wt]) => [stepAt(wt), v, e]);
  const live = S.running && S.runs[0] && S.run === S.runs[0].path;  // 지금 학습 중인 실행일 때만 현재 데이터셋 값을 쓴다
  const stepsPerEpoch = (epPts.length ? Math.max(1, Math.round(epPts[0][0])) : 0) || (live && S.check?.dataset?.steps_per_epoch) || 1;
  const all = cur.map(p => p[1]).concat(avg.map(p => p[1]), epPts.map(p => p[1])).filter(v => isFinite(v) && (!logY || v > 0));
  let lo = Math.min(...all), hi = Math.max(...all);
  const tf = v => logY ? Math.log10(v) : v;
  let tlo = tf(lo), thi = tf(hi); if (thi - tlo < 1e-12) { thi += 1e-3; tlo -= 1e-3; }
  const padY = (thi - tlo) * 0.08; tlo -= padY; thi += padY; if (!logY && lo >= 0) tlo = Math.max(tlo, 0);
  const xMax = Math.max(cur[cur.length - 1][0], (live && S.check?.dataset?.total_steps) || 0, 1), xMin = Math.min(cur[0][0], 1);
  const m = { l: 62, r: 16, t: 14, b: 30 }, pw = W - m.l - m.r, ph = H - m.t - m.b;
  const X = s => m.l + (s - xMin) / (xMax - xMin || 1) * pw, Y = v => m.t + (1 - (tf(v) - tlo) / (thi - tlo)) * ph;
  // 눈금
  ctx.font = `11px ${col("--sans")}`; ctx.fillStyle = col("--text-muted"); ctx.strokeStyle = col("--line"); ctx.lineWidth = 1;
  const nT = 5;
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (let i = 0; i <= nT; i++) {
    const tv = tlo + (thi - tlo) * i / nT, v = logY ? 10 ** tv : tv, y = Math.round(Y(v)) + .5;
    ctx.beginPath(); ctx.moveTo(m.l, y); ctx.lineTo(W - m.r, y); ctx.stroke();
    ctx.fillText(fmtNum(v), m.l - 6, y);
  }
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  const xStep = niceStep((xMax - xMin) / 6);
  for (let s = Math.ceil(xMin / xStep) * xStep; s <= xMax; s += xStep) ctx.fillText(String(s), X(s), H - m.b + 8);
  // 에포크 경계
  if (stepsPerEpoch > 1 && xMax / stepsPerEpoch <= 60) {
    ctx.strokeStyle = col("--text-muted"); ctx.setLineDash([3, 4]);
    for (let e = stepsPerEpoch; e < xMax; e += stepsPerEpoch) { const x = Math.round(X(e)) + .5; ctx.beginPath(); ctx.moveTo(x, m.t); ctx.lineTo(x, m.t + ph); ctx.stroke(); }
    ctx.setLineDash([]);
    if (X(stepsPerEpoch) - X(0) >= 18) {  // 구간 가운데 위에 에포크 번호를 적는다
      ctx.font = `10px ${col("--sans")}`; ctx.fillStyle = col("--text-muted"); ctx.textBaseline = "top";
      for (let e = 0; e < xMax; e += stepsPerEpoch) ctx.fillText(String(e / stepsPerEpoch + 1), X(Math.min(e + stepsPerEpoch / 2, xMax)), 2);
    }

  const line = (pts, color, width, alpha) => {
    ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = "round"; ctx.beginPath();
    let started = false;
    for (const [s, v] of pts) { if (!isFinite(v) || (logY && v <= 0)) { started = false; continue; } const x = X(s), y = Y(v); started ? ctx.lineTo(x, y) : ctx.moveTo(x, y); started = true; }
    ctx.stroke(); ctx.restore();
  };
  line(cur, col("--series-1"), 1, .35);
  line(avg, col("--series-1"), 2, 1);
  for (const [s, v] of epPts) {
    if (logY && v <= 0) continue;
    ctx.beginPath(); ctx.arc(X(s), Y(v), 4.5, 0, Math.PI * 2); ctx.fillStyle = col("--series-2"); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = col("--surface-1"); ctx.stroke();
  }
  chart.pts = { cur, avg, epPts, lr, stepsPerEpoch };
  chart.geom = { X, Y, m, pw, ph, xMin, xMax, W, H };
  const last = avg[avg.length - 1] || cur[cur.length - 1];
  const minAvg = avg.reduce((a, p) => p[1] < a[1] ? p : a, avg[0] || last);
  info.textContent = `스텝 ${cur[cur.length - 1][0]} · 최근 이동 평균 ${fmtNum(last[1])} · 최저 이동 평균 ${fmtNum(minAvg[1])} (스텝 ${minAvg[0]})` + (lr.length ? ` · lr ${lr[lr.length - 1][1].toExponential(2)}` : "") + (live && S.check?.dataset?.total_steps ? ` · x축은 예상 총 ${S.check.dataset.total_steps} 스텝까지` : "");
}
function fmtNum(v) { const a = Math.abs(v); return a === 0 ? "0" : a < 1e-3 || a >= 1e4 ? v.toExponential(2) : v.toPrecision(3); }
function niceStep(raw) { const p = 10 ** Math.floor(Math.log10(raw || 1)), n = raw / p; return (n < 1.5 ? 1 : n < 3.5 ? 2 : n < 7.5 ? 5 : 10) * p; }
function nearest(arr, s) { let best = null; for (const p of arr) if (!best || Math.abs(p[0] - s) < Math.abs(best[0] - s)) best = p; return best; }
function chartHover(e) {
  const tip = $("#tip");
  if (!chart.pts) { tip.style.display = "none"; return; }
  const r = $("#chartWrap").getBoundingClientRect(), x = e.clientX - r.left, g = chart.geom;
  if (x < g.m.l || x > g.W - g.m.r) { tip.style.display = "none"; drawChart(); return; }
  const s = g.xMin + (x - g.m.l) / g.pw * (g.xMax - g.xMin);
  const c = nearest(chart.pts.cur, s); if (!c) return;
  const a = nearest(chart.pts.avg, c[0]), lr = nearest(chart.pts.lr, c[0]);
  const epNo = Math.max(1, Math.ceil(c[0] / chart.pts.stepsPerEpoch)), ep = chart.pts.epPts.find(p => p[2] === epNo);
  drawChart();
  const ctx = $("#chart").getContext("2d"), cx = g.X(c[0]);
  ctx.strokeStyle = "#8d8c83"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(Math.round(cx) + .5, g.m.t); ctx.lineTo(Math.round(cx) + .5, g.m.t + g.ph); ctx.stroke();
  if (a) { ctx.beginPath(); ctx.arc(cx, g.Y(a[1]), 4, 0, Math.PI * 2); ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--series-1"); ctx.fill(); }
  tip.innerHTML = `스텝 <b>${c[0]}</b> · 에포크 ${epNo}<br>loss <b>${fmtNum(c[1])}</b>` + (a ? `<br>이동 평균 <b>${fmtNum(a[1])}</b>` : "") + (ep ? `<br>에포크 평균 <b>${fmtNum(ep[1])}</b>` : "") + (lr ? `<br>lr ${lr[1].toExponential(2)}` : "");
  tip.style.display = "block";
  const tw = tip.offsetWidth;
  tip.style.left = (cx + 14 + tw > g.W ? cx - tw - 14 : cx + 14) + "px"; tip.style.top = (g.m.t + 6) + "px";
}

const H = { list: true, open: new Set(), sig: "" };
try { const v = JSON.parse(localStorage.getItem("moss_ui_history") || "{}"); H.list = v.list !== false; H.open = new Set(v.open || []); } catch (e) {}
async function refreshOutputs() {
  if (!S.cfg.output_dir) return;
  try { S.outputs = await api("/api/outputs?output_dir=" + encodeURIComponent(S.cfg.output_dir)); } catch (e) { S.outputs = null; }

// 지금 설정의 output_name 은 위에 펼치고, 나머지는 이전 학습 목록으로 접는다. 접힌 항목의 파일은 펼칠 때 그린다.
function groupBody(g) {
  const shown = g.sample_count > g.samples.length ? `최신 ${g.samples.length}장만 표시` : "최신순";
  let h = g.models.length ? `<table class="models" style="margin-top:6px"><tr><th>파일</th><th>크기</th><th>저장 시각</th></tr>${g.models.map(f => `<tr><td>${esc(f.name)}</td><td>${fmtSize(f.size)}</td><td>${fmtTime(f.mtime)}</td></tr>`).join("")}</table>` : `<div class="empty" style="padding:14px">아직 저장된 LoRA 가 없습니다</div>`;
  h += `<h3>샘플 이미지 <span style="font-weight:400;color:var(--text-muted)">(${g.sample_count}장, ${shown})</span></h3>`;
  h += g.samples.length ? `<div class="gallery">${g.samples.map(f => `<figure data-zoom="${esc(f.path)}"><img loading="lazy" src="${imgUrl(f.path)}&t=${f.mtime}" alt=""><figcaption title="${esc(f.name)}">${esc(f.name)}</figcaption></figure>`).join("")}</div>` : `<div class="empty">샘플이 없습니다 — 샘플 프롬프트 파일과 sample_every_n_epochs 를 지정하면 에포크마다 생성됩니다</div>`;
  return h;
}
function renderOutputs() {
  const o = S.outputs, pane = $("#pane-results");
  const name = S.cfg.output_name || o?.groups?.[0]?.name || "";
  const sig = JSON.stringify([name, o]);
  if (sig === H.sig) return;  // 주기적 갱신이 스크롤과 불러온 그림을 건드리지 않게
  H.sig = sig;
  if (!o?.groups) { $("#sampleCount").textContent = 0; pane.innerHTML = `<div class="empty">출력 폴더를 읽지 못했습니다</div>`; return; }
  const cur = o.groups.find(g => g.name === name) || { name, models: [], samples: [], sample_count: 0 };
  const past = o.groups.filter(g => g !== cur);
  $("#sampleCount").textContent = cur.sample_count;
  let h = `<div style="display:flex;align-items:center;gap:8px"><b>${esc(name || "이름 없음")}</b><span style="flex:1"></span><button class="btn small" data-opendir="${esc(S.cfg.output_dir)}">출력 폴더 열기</button></div>`;
  h += groupBody(cur);
  if (past.length) {
    h += `<details class="card hist" id="histList" ${H.list ? "open" : ""}><summary>이전 학습<span class="sub">${past.length}개</span></summary><div class="hist-body">`;
    h += past.map(g => `<details class="card" data-hist="${esc(g.name)}" ${H.open.has(g.name) ? "open" : ""}><summary>${esc(g.name || "이름 없음")}<span class="sub">LoRA ${g.models.length} · ${fmtSize(g.size)} · 샘플 ${g.sample_count} · ${fmtTime(g.mtime)}</span></summary><div class="hist-body">${H.open.has(g.name) ? groupBody(g) : ""}</div></details>`).join("");
    h += `</div></details>`;
  }
  pane.innerHTML = h;
}
$("#pane-results").addEventListener("toggle", e => {
  const d = e.target, body = d.querySelector(":scope > .hist-body");
  if (d.id === "histList") H.list = d.open;
  else if (d.dataset.hist == null) return;
  else if (d.open) {

}, true);

const P = { root: "", sets: null, tab: "found", sel: null, info: null, dir: null, loading: false };

const capExt = () => (S.ds?.general?.caption_extension || ".txt").trim() || ".txt";

// 데이터셋 탭 왼쪽에 늘 떠 있는 선택기 — 처음 한 번만 폴더를 찾는다
function initPicker() {

  if (!P.sets && !P.loading) loadSets(false); else renderPicker();
}
async function loadSets(force) {

async function applyFolders(folders, mode) {
  if (!folders.length) return;
  if (!S.ds) { toast("dataset.toml 을 먼저 읽어야 합니다", true); return; }
  const subs = S.ds.subsets;
  const entry = f => ({ image_dir: f.path, num_repeats: String(f.repeats ?? 1) });
  if (mode === "add") {
    const have = new Set(subs.map(s => (s.image_dir || "").replace(/\\/g, "/").toLowerCase()));
    const fresh = folders.filter(f => !have.has(f.path.toLowerCase()));
    if (!fresh.length) { toast("이미 들어 있는 폴더입니다"); return; }
    // 빈 기본 칸(경로가 없거나 없는 폴더)은 덮어쓴다
    if (subs.length === 1 && S.check?.dataset?.subsets?.[0] && !S.check.dataset.subsets[0].ok) {
      Object.assign(subs[0], { image_dir: fresh[0].path, num_repeats: String(fresh[0].repeats ?? 1) }); fresh.shift();
    }
    fresh.forEach(f => subs.push(entry(f)));
  } else {
    folders.forEach((f, k) => { if (k < subs.length) Object.assign(subs[k], { image_dir: f.path, num_repeats: String(f.repeats ?? 1) }); else subs.push(entry(f)); });
    // 남는 기존 칸은 뒤에서부터 지운다(원본 인덱스와 화면 인덱스가 같도록)
    for (let k = subs.length - 1; k >= folders.length; k--) {
      if (k < S.dsOrig.subsets.length) { S.removedSubsets.push(k); S.dsOrig.subsets.splice(k, 1); }
      subs.splice(k, 1);
    }
  }
  renderLeft();
  if (await save(true)) { P.sel = null; P.info = null; renderPicker(); toast(`이미지 폴더 ${S.ds.subsets.length}개로 저장했습니다 — 오른쪽에서 점검 결과를 확인하세요`); }
}
function pickerClick(e) {
  const t = e.target.closest("[data-pktab],[data-pkset],[data-pkpath],[data-pknav],[data-pkapply],button");
  if (!t) return;
  if (t.dataset.pktab) { P.tab = t.dataset.pktab; renderPicker(); return; }
  if (t.dataset.pkset !== undefined) {
    const list = P.sets.filter(s => s.group === t.dataset.pkset && s.repeats != null);
    applyFolders(list.map(s => ({ path: s.path, repeats: s.repeats })), "replace"); return;
  }
  if (t.dataset.pkapply) {
    const i = P.info, kids = childSets(i).map(k => ({ path: k.path, repeats: k.repeats }));
    const self = [{ path: i.path, repeats: i.repeats }];
    applyFolders(t.dataset.pkapply.startsWith("kids") ? kids : self, t.dataset.pkapply.endsWith("add") ? "add" : "replace"); return;
  }
  if (t.dataset.pknav !== undefined && P.tab === "browse") {
    // 이미지가 든 폴더는 한 번 누르면 선택, 선택된 상태에서 다시 누르거나 하위 폴더만 있으면 들어간다

document.addEventListener("keyup", e => { VW.keys.delete(e.code); }, true);
window.addEventListener("blur", () => VW.keys.clear());
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) closeViewer(); });  // 전체 화면의 Esc 는 브라우저가 먼저 처리한다
$("#viewer").addEventListener("wheel", vwWheel, { passive: false });
$("#viewer").addEventListener("contextmenu", e => { e.preventDefault(); closeViewer(); });
for (const ev of ["pointerdown", "pointermove", "pointerup", "pointercancel"]) $("#viewer").addEventListener(ev, vwPointer);
window.addEventListener("beforeunload", e => { if (hasChanges()) { e.preventDefault(); e.returnValue = ""; } });

document.querySelectorAll("#tabs .tab").forEach(t => { const n = TAB_ORDER.indexOf(t.dataset.pane) + 1; t.title = `Alt+${n}`; t.querySelector(".key").textContent = `Alt+${n}`; });
try { switchTab(localStorage.getItem("moss_ui_tab") || "dataset"); } catch (e) { switchTab("dataset"); }
let lastConfig = "";
try { lastConfig = localStorage.getItem("moss_ui_config") || ""; } catch (e) {}
load(lastConfig).catch(e => toast("불러오기 실패: " + e.message, true));
poll();
setInterval(poll, 1000);
setInterval(() => { if (!S.running) { refreshOutputs(); } }, 30000);
</script>
</body>
</html>
